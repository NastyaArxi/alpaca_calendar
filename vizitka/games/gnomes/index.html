/* Дизайн из макета «Гномы и подарки»: ёлочная ночь, карточки цвета сливок с золотой рамкой,
   красный бархат кнопок, плитки со снежной шапочкой. Шрифт Montserrat 600–900. */
:root {
  --night-1: #03140F;
  --night-2: #072B23;
  --night-3: #0E4535;
  --cream: #FFF7E8;
  --cream-board: #FBF1DE;
  --gold: #F5C04A;
  --gold-dark: #C48A1E;
  --gold-ring: #A86F12;
  --red: #E5293F;
  --red-2: #B80D25;
  --red-ink: #7A0819;
  --mint: #A9CBBB;
  --ink: #2A2D3E;
  --ink-2: #5B5F73;
  --green: #22A45D;
  --tile: 62px;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html, body {
  margin: 0; height: 100%;
  background: linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 40%, var(--night-3) 100%);
  color: #fff;
  font-family: Montserrat, system-ui, sans-serif; font-weight: 700;
  overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }

#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; }

/* снег: слой сдвигается вниз ровно на три периода узора, поэтому шов не виден */
.snow {
  position: absolute; left: 0; right: 0; top: -390px; bottom: 0; pointer-events: none;
  background-image:
    radial-gradient(circle at 20px 30px, rgba(255,255,255,.85) 1.6px, transparent 2.4px),
    radial-gradient(circle at 90px 80px, rgba(255,255,255,.55) 1.2px, transparent 2px),
    radial-gradient(circle at 60px 115px, rgba(255,255,255,.4) 1px, transparent 1.8px);
  background-size: 130px 130px;
  animation: snow 18s linear infinite;
}
@keyframes snow { to { transform: translateY(390px); } }

/* гирлянда */
.garland { position: absolute; left: 0; right: 0; top: 0; height: 30px; z-index: 3; pointer-events: none; }
.garland svg { width: 100%; height: 30px; display: block; }
.bulb { animation: twinkle 1.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

.screen {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  padding: 34px 16px 14px;
}

/* ---------- общие элементы ---------- */
.card {
  position: relative; background: var(--cream); color: var(--ink);
  border: 3px solid var(--gold); border-radius: 22px;
  box-shadow: 0 5px 0 var(--gold-dark), 0 16px 34px rgba(0,0,0,.45);
}
.holly { position: absolute; width: 58px; height: 40px; pointer-events: none; }
.holly-tr { right: -10px; top: -22px; }
.holly-tl { left: -14px; top: -20px; }

.btn-red {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-width: 240px; padding: 12px 28px; border-radius: 22px;
  background: linear-gradient(180deg, var(--red), var(--red-2));
  border: 3px solid var(--gold); box-shadow: 0 5px 0 var(--red-ink), 0 0 0 6px rgba(122,8,25,.25);
  color: var(--cream);
}
.btn-red b { font-size: 26px; font-weight: 900; line-height: 1.1; }
.btn-red small { font-size: 13px; font-weight: 800; color: #FFD98A; }
.btn-red:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--red-ink); }
.btn-red.wide { width: 100%; min-width: 0; }

.btn-cream {
  display: inline-flex; align-items: center; gap: 12px; height: 54px; padding: 0 8px 0 20px;
  border-radius: 27px; background: var(--cream); border: 3px solid var(--gold); box-shadow: 0 4px 0 var(--gold-dark);
  color: var(--ink); font-size: 18px; font-weight: 900;
}
.btn-cream:disabled { opacity: .5; }
.btn-cream:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gold-dark); }

.btn-gold {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  padding: 10px 12px 10px 22px; border-radius: 22px; border: 3px solid #FFE08A;
  background: linear-gradient(180deg, #FFD56B, #F2B33D); box-shadow: 0 5px 0 var(--gold-dark), 0 0 0 6px rgba(245,192,74,.2);
  color: var(--ink); text-align: left;
}
.btn-gold b { display: block; font-size: 22px; font-weight: 900; }
.btn-gold small { display: block; font-size: 13px; font-weight: 800; color: #6B4A12; }

.play-ico {
  flex: none; width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(180deg, var(--red), var(--red-2));
  position: relative; box-shadow: 0 2px 0 var(--red-ink);
}
.play-ico::after { content: ""; position: absolute; left: 15px; top: 12px; border-left: 13px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }

.link-gold, .link-red {
  background: none; border: 0; padding: 6px; font-size: 18px; font-weight: 900;
  text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px;
}
.link-gold { color: var(--gold); }
.link-red { color: var(--red-2); }

.icon-btn {
  width: 48px; height: 48px; padding: 0; flex: none; border-radius: 16px;
  background: var(--cream); border: 2px solid var(--gold); box-shadow: 0 4px 0 var(--gold-dark);
  color: var(--red-ink); display: flex; align-items: center; justify-content: center;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.off { opacity: .5; }
.btn-red:focus-visible, .btn-cream:focus-visible, .btn-gold:focus-visible, .icon-btn:focus-visible, .tile:focus-visible, .lvl:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

/* гномы с подарками в ряд */
.gnome-row { display: flex; justify-content: center; gap: 4px; }
.gnome-row .g { width: 46px; height: 82px; animation: bob 1s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

/* ---------- 1 · старт ---------- */
#screen-menu { justify-content: center; gap: 14px; }
.logo { margin: 4px 0 0; display: flex; flex-direction: column; align-items: center; line-height: 1; }
.logo-1 { font-size: 58px; font-weight: 900; color: #fff; text-shadow: 0 4px 0 var(--red-2), 0 0 24px rgba(255,255,255,.25); }
.logo-2 { font-size: 34px; font-weight: 900; color: var(--gold); text-shadow: 0 3px 0 var(--red-2); margin-top: 8px; }
.subtitle { margin: 0; max-width: 28ch; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.45; color: #E6F2EC; }
.howto { width: 100%; max-width: 360px; padding: 16px 18px 14px; }
.howto h3 { margin: 0 0 10px; font-size: 20px; font-weight: 900; color: var(--red-2); }
.howto ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.howto li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--ink); }
.howto li i { font-style: normal; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); }
.forest { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; z-index: -1; pointer-events: none; }
.forest svg { width: 100%; height: 100%; display: block; }

/* ---------- 2 · карта уровней ---------- */
#screen-map { padding-bottom: 0; }
.map-head { width: 100%; display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 10px; }
.map-head h2 { margin: 0; text-align: center; font-size: 30px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 var(--red-2); }
.stars-pill { height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(0,0,0,.3); border: 2px solid var(--gold); color: var(--gold); display: flex; align-items: center; gap: 6px; font-weight: 900; }
.map-progress { width: 100%; display: flex; justify-content: space-between; margin: 14px 0 6px; font-size: 13px; font-weight: 800; color: #E6F2EC; }
.bar { width: 100%; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--gold); }
.map-list {
  width: 100%; flex: 1 1 auto; overflow-y: auto; padding: 18px 6px 24px; display: flex; flex-direction: column; gap: 20px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  /* мягкий край сверху: карточки уходят под полосу прогресса плавно */
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 16px);
  mask-image: linear-gradient(180deg, transparent 0, #000 16px);
}
.map-list::-webkit-scrollbar { display: none; }
.chapter-head { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; margin-bottom: 10px; }
.ch-num { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; }
.ch-title { font-size: 16px; font-weight: 900; }
.ch-sub { font-size: 11px; font-weight: 700; color: var(--mint); margin-top: 2px; }
.flakes { color: #CFE8FF; letter-spacing: 2px; font-size: 18px; }

    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function gridFromPicture(pic) {
    return pic.rows.map(r => [...r].map(ch => (ch === '.' ? null : ch)));
  }

  // Пустые клетки, связанные с краем (поле дополнено рамкой из пустоты).
  function outside(grid) {
    const H = grid.length, W = grid[0].length;
    const seen = Array.from({ length: H + 2 }, () => new Array(W + 2).fill(false));
    const empty = (x, y) => x < 0 || y < 0 || x >= W || y >= H || !grid[y][x];
    const stack = [[-1, -1]];
    seen[0][0] = true;
    while (stack.length) {
      const [x, y] = stack.pop();
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (nx < -1 || ny < -1 || nx > W || ny > H || seen[ny + 1][nx + 1] || !empty(nx, ny)) continue;
        seen[ny + 1][nx + 1] = true;
        stack.push([nx, ny]);
      }
    }
    return (x, y) => seen[y + 1] && seen[y + 1][x + 1];
  }

  // Доступные блоки по цветам: { color: [[x, y], ...] }.
  function available(grid) {
    const out = outside(grid);
    const res = {};
    grid.forEach((row, y) => row.forEach((c, x) => {
      if (c && DIRS.some(([dx, dy]) => out(x + dx, y + dy))) (res[c] = res[c] || []).push([x, y]);
    }));
    return res;
  }

  // Слой очистки каждого блока: 0 — доступен сразу, 1 — после снятия слоя 0 и т. д.
  function peelLayers(pic) {
    const grid = gridFromPicture(pic);
    const layer = {};
    for (let k = 0; ; k++) {
      const av = Object.values(available(grid)).flat();
      if (!av.length) break;
      av.forEach(([x, y]) => { layer[x + ',' + y] = k; grid[y][x] = null; });
    }
    return layer;

  // Правила уровня из главы: ячейки, колонки и наибольший размер плитки.
  // Первые два уровня — обучение: у них на одну ячейку больше.
  // Внутри главы порядок подарков постепенно перемешивается сильнее.
  function difficulty(L, chapter) {
    const k = L % 12;
    const top = chapter.maxTile;

      slots: chapter.slots + (L < 2 ? 1 : 0),
      queues: chapter.queues,
      jitter: Math.min(0.8 + Math.floor(L / 12) * 1.2 + k * 0.25, 7),
      sizes: [Math.round(top * 0.4), Math.round(top * 0.6), Math.round(top * 0.8), top].filter(n => n >= 8)

  function makeBags(pic, d, rnd) {
    const layer = peelLayers(pic);
    const byColor = {};
    pic.rows.forEach((r, y) => [...r].forEach((ch, x) => {
      if (ch !== '.') (byColor[ch] = byColor[ch] || []).push(layer[x + ',' + y]);
    }));
    const bags = [];
    Object.entries(byColor).forEach(([color, layers]) => {
      layers.sort((a, b) => a - b);
      let i = 0;

        const left = layers.length - i, top = Math.max(...d.sizes);

  // Это честно, потому что блоки только исчезают, а доступность от этого лишь растёт.
  function createState(level) {

      grid: gridFromPicture(level.pic),
      queues: level.queues.map(q => q.map(b => ({ ...b }))),

  // Своя мелодия «музыкальной шкатулки»: тихие арпеджио C–Am–F–G и колокольчик сверху.
  const Music = {
    on: true, playing: false, timer: null, next: 0, step: 0, gain: null,
    NOTE: n => 440 * Math.pow(2, ({ C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 }[n[0]] + (+n.slice(1) - 4) * 12) / 12),
    CHORDS: [['C3', ['C4', 'E4', 'G4', 'E4', 'C5', 'G4', 'E4', 'G4']], ['A2', ['A3', 'C4', 'E4', 'C4', 'A4', 'E4', 'C4', 'E4']],
      ['F2', ['F3', 'A3', 'C4', 'A3', 'F4', 'C4', 'A3', 'C4']], ['G2', ['G3', 'B3', 'D4', 'B3', 'G4', 'D4', 'B3', 'D4']]],
    // по четыре четверти на такт, '-' — пауза; 8 тактов
    MELODY: ['E5', 'G5', 'E5', 'D5', 'C5', 'E5', 'A4', '-', 'A4', 'C5', 'F5', 'E5', 'D5', 'B4', 'G4', '-',
      'E5', 'G5', 'C6', 'G5', 'A5', 'G5', 'E5', '-', 'F5', 'E5', 'D5', 'C5', 'D5', '-', 'G4', '-'],
    EIGHTH: 0.3,
    note(freq, t, dur, type, vol) {
      const ctx = Sound.ctx;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.gain);
      o.start(t); o.stop(t + dur + 0.05);
    },
    schedule() {
      const ctx = Sound.ctx;
      while (this.next < ctx.currentTime + 0.4) {
        const s = this.step % 64, bar = Math.floor(s / 8) % 4, i = s % 8;
        const [bass, arp] = this.CHORDS[bar];
        if (i === 0 || i === 4) this.note(this.NOTE(bass), this.next, 0.9, 'triangle', 0.5);
        this.note(this.NOTE(arp[i]), this.next, 0.35, 'triangle', 0.22);
        if (i % 2 === 0) {
          const m = this.MELODY[Math.floor(s / 2)];
          if (m !== '-') {
            this.note(this.NOTE(m), this.next, 0.9, 'sine', 0.45);
            this.note(this.NOTE(m) * 2, this.next, 0.4, 'sine', 0.08);
          }
        }
        this.next += this.EIGHTH; this.step++;
      }
    },
    start() {
      if (!this.on || this.playing) return;
      try {
        Sound.ctx = Sound.ctx || new (window.AudioContext || window.webkitAudioContext)();
        if (Sound.ctx.state === 'suspended') Sound.ctx.resume();
        if (!this.gain) { this.gain = Sound.ctx.createGain(); this.gain.connect(Sound.ctx.destination); }
        this.gain.gain.value = 0.06;
        this.playing = true;
        this.next = Sound.ctx.currentTime + 0.1;
        this.timer = setInterval(() => this.schedule(), 150);
        this.schedule();
      } catch (e) {}
    },
    stop() {
      this.playing = false;
      if (this.timer) clearInterval(this.timer);
      this.timer = null;
      if (this.gain) this.gain.gain.value = 0;
    }
  };

  // ---------- состояние ----------
  let save = { level: 0, stars: {} };
  let levelIndex = 0, pic = null, level = null;
  let grid = null, W = 0, H = 0, queues = [], slots = [], gnomes = [], reserved = new Set();
  let running = false, over = false, extraSlots = 0, revived = false, timeAdded = false, geo = null, uid = 0;
  let timeLeft = 0, shownSec = -1, loseKind = 'stuck';
  let avCache = null, lastGulp = 0;

  // ---------- персонажи (рисунок из UI-кита) ----------
  function gnomeSVG(hat, box) {
    const gift = box ? `<rect x="11" y="1" width="18" height="15" rx="2.5" fill="${box}"/>` +
      '<rect x="18.4" y="1" width="3.2" height="15" fill="#fff"/><rect x="11" y="6.8" width="18" height="3.2" fill="#fff"/>' +
      '<path d="M20 1.5 C15 -3 13 1 20 1.5 Z M20 1.5 C25 -3 27 1 20 1.5 Z" fill="#fff"/>' : '';
    return `<svg viewBox="0 -4 40 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${gift}` +
      '<ellipse cx="20" cy="55" rx="10" ry="8" fill="#C8102E"/><rect x="10" y="54" width="20" height="2.6" fill="#3A1A10"/>' +
      '<rect x="18" y="53.4" width="4" height="3.8" rx="1" fill="#F5C04A"/>' +
      '<ellipse cx="15" cy="63" rx="4" ry="1.6" fill="#3A2416"/><ellipse cx="25" cy="63" rx="4" ry="1.6" fill="#3A2416"/>' +
      `<path d="M20 19 L9 38 H31 Z" fill="${hat}"/><rect x="8" y="35.5" width="24" height="4.5" rx="2.2" fill="#FFFFFF"/>` +
      '<circle cx="20" cy="19" r="3.2" fill="#FFFFFF"/><path d="M11 44 Q20 61 29 44 Z" fill="#FFFFFF"/>' +
      '<rect x="12.5" y="39.5" width="15" height="6.5" rx="3" fill="#FFD3A8"/>' +
      '<circle cx="16.3" cy="42" r="1" fill="#2A2D3E"/><circle cx="23.7" cy="42" r="1" fill="#2A2D3E"/>' +
      '<circle cx="20" cy="44.2" r="1.9" fill="#F28B82"/></svg>';
  }

  const SAD_GNOME = '<svg viewBox="0 0 40 64" aria-hidden="true">' +
    '<ellipse cx="20" cy="55" rx="10" ry="8" fill="#C8102E"/><rect x="10" y="54" width="20" height="2.6" fill="#3A1A10"/>' +
    '<rect x="18" y="53.4" width="4" height="3.8" rx="1" fill="#F5C04A"/>' +
    '<ellipse cx="15" cy="63" rx="4" ry="1.6" fill="#3A2416"/><ellipse cx="25" cy="63" rx="4" ry="1.6" fill="#3A2416"/>' +
    '<path d="M22 22 L8 37 H31 Z" fill="#2F6BEB"/><circle cx="25" cy="21" r="3.2" fill="#fff"/>' +
    '<rect x="8" y="35.5" width="24" height="4.5" rx="2.2" fill="#FFFFFF"/><path d="M11 44 Q20 61 29 44 Z" fill="#FFFFFF"/>' +
    '<rect x="12.5" y="39.5" width="15" height="6.5" rx="3" fill="#FFD3A8"/>' +
    '<path d="M14.8 42.4 q1.5 -1.2 3 0 M22.2 42.4 q1.5 -1.2 3 0" stroke="#2A2D3E" stroke-width="1" fill="none" stroke-linecap="round"/>' +
    '<circle cx="20" cy="44.6" r="1.7" fill="#F28B82"/><path d="M26 44 q1 2.5 0 4" stroke="#7FD8FF" stroke-width="1.2" fill="none"/></svg>';

  const SACK_SVG = '<svg viewBox="0 0 68 62" aria-hidden="true">' +
    '<ellipse cx="34" cy="38" rx="27" ry="22" fill="#C8102E"/>' +
    '<path d="M14 30 Q11 46 21 54" stroke="rgba(255,255,255,.3)" stroke-width="5" fill="none" stroke-linecap="round"/>' +
    '<ellipse cx="34" cy="14" rx="20" ry="8" fill="#4A0612"/>' +
    '<path d="M14 14 Q34 26 54 14" stroke="#F5C04A" stroke-width="4" fill="none" stroke-linecap="round"/>' +
    '<circle cx="46" cy="44" r="3" fill="#FFFFFF" opacity=".85"/><circle cx="24" cy="46" r="2" fill="#FFFFFF" opacity=".7"/>' +
    '<circle cx="38" cy="52" r="1.6" fill="#FFFFFF" opacity=".7"/></svg>';

  const STAR = (on, mid) => `<svg viewBox="0 0 24 24" class="${mid ? 'mid' : ''}" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on ? '#F5C04A' : '#E3D6BF'}" stroke="${on ? '#C48A1E' : '#D3C4A8'}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;

  // Картинки гномов для холста: по одной на каждый цвет колпака.
  const GNOME_IMG = {};
  Object.keys(PALETTE).forEach(k => {
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(gnomeSVG(PALETTE[k]));
    GNOME_IMG[k] = img;
  });

  // ---------- рисование ----------
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // Блок игрушки: скругление, снизу тень (тот же цвет темнее), сверху блик.
  function drawBlock(ctx, x, y, s, key) {
    const r = Math.max(1, s * 0.22);
    ctx.fillStyle = SHADE[key];
    roundRect(ctx, x, y, s, s, r); ctx.fill();
    ctx.fillStyle = PALETTE[key];
    roundRect(ctx, x, y, s, s - Math.max(1, s * 0.16), r); ctx.fill();
    if (s >= 7) {
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.fillRect(x + r, y + s * 0.08, s - 2 * r, Math.max(1, s * 0.1));
    }
  }

  // Гном на холсте: x, y — точка у ног; s — высота. Переваливается при ходьбе.
  function drawGnome(ctx, x, y, s, key, carry, t) {
    const img = GNOME_IMG[key];
    const w = s * 40 / 70;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(t * 19.6) * 0.14);
    if (img && img.complete) ctx.drawImage(img, -w / 2, -s, w, s);
    if (carry) {
      const b = s * 0.3;
      drawBlock(ctx, -b / 2, -s * 0.98, b, carry);
    }
    ctx.restore();
  }

  function setupCanvas(canvas, w, h) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }

  function drawToy(canvas, p, maxW, maxH) {
    const c = Math.max(1, Math.floor(Math.min(maxW / p.w, maxH / p.h) * 4) / 4);
    const ctx = setupCanvas(canvas, c * p.w, c * p.h);
    p.rows.forEach((r, y) => [...r].forEach((ch, x) => {
      if (ch === '.') return;
      if (c >= 5) drawBlock(ctx, x * c + 0.4, y * c + 0.4, c - 0.8, ch);
      else { ctx.fillStyle = PALETTE[ch]; ctx.fillRect(x * c, y * c, c * 0.86, c * 0.86); }
    }));
  }

  // ---------- гирлянда ----------
  function buildGarland() {
    const lc = ['#FF4D4F', '#FFD23F', '#2BD46F', '#4DB8FF', '#FF7AD9'];
    const n = 14, wave = x => 6 + 9 * Math.abs(Math.sin(Math.PI * x * 4));
    let pts = '';
    for (let i = 0; i <= 100; i++) pts += `${i},${wave(i / 100).toFixed(1)} `;
    let bulbs = '';
    for (let i = 0; i < n; i++) {
      const fx = (i + 0.5) / n;
      bulbs += `<ellipse class="bulb" cx="${fx * 100}" cy="${wave(fx) + 6}" rx=".9" ry="5" fill="${lc[i % 5]}" style="animation-delay:${((i * 0.37) % 1.6).toFixed(2)}s;filter:drop-shadow(0 0 3px ${lc[i % 5]})"/>`;
    }
    $('garland').innerHTML = `<svg viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#1B3A2C" stroke-width="1.5" vector-effect="non-scaling-stroke"/>${bulbs}</svg>`;
  }

  // ---------- раскладка уровня ----------
  // Поле рисуется на #board внутри карточки. Гномы — на слое #fx поверх всего экрана,
  // потому что бегают от ячеек к игрушке и обратно в мешок.
  function layout() {
    if (!grid) return;
    const width = Math.min(window.innerWidth, 480) - 32;
    const n = Math.max(slots.length, queues.length);
    const tile = Math.floor(Math.max(40, Math.min(62, (width - (n - 1) * 8) / n, window.innerHeight / 13.6)));
    document.documentElement.style.setProperty('--tile', tile + 'px');
    const r = els.stage.getBoundingClientRect();
    const c = Math.max(6, Math.min(22, Math.floor(Math.min((r.width - 20) / (W + 2), (r.height - 30) / (H + 2)))));
    const w = (W + 2) * c, h = (H + 2) * c;
    geo = { c, w, h, ox: c, oy: c, ctx: setupCanvas(els.board, w, h) };
    const g = els.app.getBoundingClientRect();
    geo.fxCtx = setupCanvas(els.fx, g.width, g.height);
    geo.fw = g.width; geo.fh = g.height;
    locate();
  }

  // Где поле, мешок и квадраты в ячейках находятся на слое гномов.
  function locate() {
    if (!geo) return;
    const g = els.app.getBoundingClientRect(), b = els.board.getBoundingClientRect(), s = els.sack.getBoundingClientRect();
    geo.bx = b.left - g.left; geo.by = b.top - g.top;
    geo.mouth = { x: s.left - g.left + s.width / 2, y: s.top - g.top + s.height * 0.3 };
    slots.forEach(bag => {
      if (!bag) return;
      const el = els.slots.querySelector(`[data-id="${bag.id}"]`);
      if (!el) return;
      const e = el.getBoundingClientRect();
      bag.origin = { x: e.left - g.left + e.width / 2, y: e.top - g.top + 4 };
    });
  }

  const cellXY = (x, y) => ({ x: geo.bx + geo.ox + (x + 0.5) * geo.c, y: geo.by + geo.oy + (y + 0.5) * geo.c });

  function render(now) {
    if (!geo || !grid) return;
    const { ctx, c, ox, oy, w, h } = geo;
    ctx.clearRect(0, 0, w, h);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const ch = grid[y][x];
      if (ch) drawBlock(ctx, ox + x * c + 0.5, oy + y * c + 0.5, c - 1, ch);
    }
    const fx = geo.fxCtx, t = now / 1000;
    fx.clearRect(0, 0, geo.fw, geo.fh);
    const s = Math.max(20, c * 1.9);
    gnomes.forEach((g, i) => drawGnome(fx, g.x, g.y + s * 0.45, s, g.color, g.carry, t + i * 0.13));
  }

  // ---------- плитки в очередях и ячейках ----------
  function tileEl(key, n, cls) {
    const d = document.createElement('button');
    d.type = 'button';
    d.className = 'tile ' + cls;
    d.style.background = PALETTE[key];
    d.style.color = INK[key];
    d.style.boxShadow = `0 5px 0 ${SHADE[key]}, inset 0 3px 0 rgba(255,255,255,.3)`;
    d.innerHTML = `<span class="n">${n}</span>`;
    return d;
  }

  function renderUI() {
    els.queues.innerHTML = '';
    queues.forEach((q, qi) => {
      const col = document.createElement('div');
      col.className = 'queue';
      q.slice(0, 2).forEach((bag, i) => {
        const el = tileEl(bag.color, bag.n, i === 0 ? 'front' : 'back');
        if (i === 0) el.addEventListener('pointerdown', e => { e.preventDefault(); pick(qi); });
        else el.tabIndex = -1;
        col.appendChild(el);
      });
      const more = document.createElement('div');
      more.className = 'more';
      more.textContent = q.length > 2 ? `+${q.length - 2}` : '';
      col.appendChild(more);
      els.queues.appendChild(col);
    });
    els.slots.innerHTML = '';
    slots.forEach((bag, i) => {
      const s = document.createElement('div');
      s.className = 'slot' + (i >= level.slots ? ' extra' : '');
      if (bag) {
        const el = tileEl(bag.color, bag.n - bag.delivered, 'active');
        el.dataset.id = bag.id;
        el.tabIndex = -1;
        s.appendChild(el);
      }
      els.slots.appendChild(s);
    });
    els.slots.classList.toggle('full', slots.every(Boolean));
    els.addSlot.disabled = extraSlots >= MAX_EXTRA;
    locate();
  }

  function updateCounter(bag) {
    const el = els.slots.querySelector(`[data-id="${bag.id}"] .n`);
    if (el) el.textContent = bag.n - bag.delivered;
  }

  function pick(qi) {
    if (!running || over) return;
    const q = queues[qi];
    if (!q || !q.length) return;
    const free = slots.indexOf(null);
    if (free < 0) {
      Sound.deny();
      els.slots.classList.remove('shake'); void els.slots.offsetWidth; els.slots.classList.add('shake');
      return;
    }
    const b = q.shift();
    slots[free] = { id: ++uid, color: b.color, n: b.n, delivered: 0, claimed: 0, out: 0, lastSend: 0 };
    Sound.tap();
    renderUI();
  }

  // ---------- гномы ----------
  function availableNow() {
    if (!avCache) avCache = Engine.available(grid);
    return avCache;
  }

  // Путь по пустым клеткам от клетки под полем до соседней с блоком клетки.
  function findPath(tx, ty, sx) {
    const out = Engine.outside(grid);
    const sy = H;
    const key = (x, y) => x + ',' + y;
    const prev = new Map([[key(sx, sy), null]]);
    const queue = [[sx, sy]];
    while (queue.length) {
      const [x, y] = queue.shift();
      if (Math.abs(x - tx) + Math.abs(y - ty) === 1) {
        const path = [[tx, ty]];
        for (let k = key(x, y); k; k = prev.get(k)) path.unshift(k.split(',').map(Number));
        return path;
      }
      for (const [dx, dy] of [[0, -1], [-1, 0], [1, 0], [0, 1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < -1 || ny < -1 || nx > W || ny > H || prev.has(key(nx, ny)) || !out(nx, ny)) continue;
        prev.set(key(nx, ny), key(x, y));
        queue.push([nx, ny]);
      }
    }
    return null;
  }

  function dispatch(now) {
    slots.forEach(bag => {
      if (!bag || bag.claimed >= bag.n || bag.out >= PER_BAG || now - bag.lastSend < SEND_GAP) return;
      const list = (availableNow()[bag.color] || []).filter(([x, y]) => !reserved.has(x + ',' + y));
      if (!list.length) return;
      const origin = bag.origin || geo.mouth;
      // клетка под полем напротив квадрата — отсюда гномы заходят на поле
      const sx = Math.max(-1, Math.min(W, Math.round((origin.x - geo.bx - geo.ox) / geo.c - 0.5)));
      list.sort((a, b) => (a[0] - sx) ** 2 + (a[1] - H) ** 2 - ((b[0] - sx) ** 2 + (b[1] - H) ** 2));
      for (const [tx, ty] of list.slice(0, 6)) {
        const path = findPath(tx, ty, sx);
        if (!path) continue;
        reserved.add(tx + ',' + ty);
        bag.claimed++; bag.out++; bag.lastSend = now;
        const pts = [{ ...origin }, ...path.map(([x, y]) => cellXY(x, y))];
        gnomes.push({ bag, color: bag.color, pts, i: 0, x: pts[0].x, y: pts[0].y, target: [tx, ty], carry: null, back: false });
        return;
      }
    });
  }

  function moveGnomes(dt, now) {
    const step = SPEED * geo.c * dt;
    let changed = false;
    gnomes = gnomes.filter(g => {
      let left = step;
      while (left > 0 && g.i < g.pts.length - 1) {
        const a = { x: g.x, y: g.y }, b = g.pts[g.i + 1];
        const d = Math.hypot(b.x - a.x, b.y - a.y);
        if (d <= left) { g.x = b.x; g.y = b.y; g.i++; left -= d; }
        else { g.x += ((b.x - a.x) / d) * left; g.y += ((b.y - a.y) / d) * left; left = 0; }
      }
      if (g.i < g.pts.length - 1) return true;
      if (!g.back) {
        // дошёл до блока: забирает его и несёт в мешок
        const [tx, ty] = g.target;
        grid[ty][tx] = null; reserved.delete(tx + ',' + ty); avCache = null;
        g.carry = g.color; g.back = true; g.i = 0;
        g.pts = [...g.pts.slice(1, -1).reverse(), { ...geo.mouth }];
        Sound.drop();
        return true;
      }
      // донёс до мешка
      const bag = g.bag;
      bag.delivered++; bag.out--;
      if (now - lastGulp > 280) {
        lastGulp = now;
        els.sack.classList.remove('gulp'); void els.sack.offsetWidth; els.sack.classList.add('gulp');
      }
      if (bag.delivered >= bag.n) {
        const idx = slots.indexOf(bag);
        if (idx >= 0) slots[idx] = null;
        Sound.done();
        changed = true;
      } else updateCounter(bag);
      return false;
    });
    if (changed) renderUI();
  }

  function isStuck() {
    if (gnomes.length || slots.some(s => !s)) return false;
    const av = availableNow();
    return slots.every(bag => !(av[bag.color] || []).some(([x, y]) => !reserved.has(x + ',' + y)));
  }

  let lastFrame = performance.now();
  function frame(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;
    if (running && !over && geo) {
      dispatch(now);
      moveGnomes(dt, now);
      timeLeft -= dt;
      renderTimer();
      if (!gnomes.length && grid.every(r => r.every(c => !c))) win();
      else if (timeLeft <= 0) lose('time');
      else if (isStuck()) lose();
    }
    if (!els.game.hidden) render(now);
    requestAnimationFrame(frame);
  }

  // ---------- уровни ----------
  function blocksIn(p) { return p.rows.join('').replace(/\./g, '').length; }

  function startLevel(index) {
    levelIndex = Math.min(index, TOTAL - 1);
    pic = PICTURES[levelIndex];
    const ch = chapterOf(levelIndex);
    level = Engine.buildLevel(pic, levelIndex, ch);
    grid = Engine.gridFromPicture(pic);
    W = pic.w; H = pic.h;
    queues = level.queues.map(q => q.map(b => ({ ...b })));
    slots = Array(level.slots).fill(null);
    gnomes = []; reserved = new Set(); avCache = null;
    over = false; extraSlots = 0; revived = false; timeAdded = false;
    timeLeft = timeLimit(pic, levelIndex); shownSec = -1; renderTimer();
    els.addTime.querySelector('span').textContent = fill(T.addTime, { n: TIME_BONUS });
    els.level.textContent = `${T.level} ${levelIndex + 1}`;
    const b = blocksIn(pic);
    els.levelSub.textContent = `${ch.name[lang] || ch.name.ru} · ${toyName(pic)} · ${b} ${blocksWord(b)}`;
    els.win.hidden = true; els.lose.hidden = true;
    show('game');
    layout();      // размер плиток
    renderUI();    // плитки, ячейки и мешок
    layout();      // поле под оставшееся место
    running = true;
    Platform.gameplayStart();
  }

  function confetti() {
    const pal = ['#E8383D', '#F5C04A', '#3EC1F3', '#22A45D', '#FF6FB5', '#8B4DF0', '#FF8A1F', '#FFFFFF'];
    let html = '';
    for (let i = 0; i < 26; i++) {
      html += `<i style="left:${(i * 53) % 100}%;width:${6 + (i % 3) * 2}px;height:${10 + (i % 2) * 4}px;background:${pal[i % pal.length]};` +
        `animation-duration:${(4 + (i % 5) * 0.7).toFixed(1)}s;animation-delay:${(-(i * 0.47) % 5).toFixed(2)}s"></i>`;
    }
    $('confetti').innerHTML = html;
  }

  function gnomeRow(el, boxes, hats) {
    el.innerHTML = boxes.map((b, i) => `<div class="g" style="animation-delay:${(i * 0.14).toFixed(2)}s">${gnomeSVG(hats[i % hats.length], b)}</div>`).join('');
  }

  function win() {
    over = true;
    running = false;
    Platform.gameplayStop();
    Sound.win();
    const stars = Math.max(1, 3 - (extraSlots ? 1 : 0) - (revived ? 1 : 0) - (timeAdded ? 1 : 0));
    save.stars[levelIndex] = Math.max(save.stars[levelIndex] || 0, stars);
    save.level = Math.max(save.level, levelIndex + 1);
    Platform.save(save);
    const b = blocksIn(pic), last = levelIndex >= TOTAL - 1;
    setTimeout(() => {
      $('win-stars').innerHTML = STAR(stars >= 1) + STAR(stars >= 2, true) + STAR(stars >= 3);
      $('win-eyebrow').textContent = fill(T.eyebrow, { n: levelIndex + 1, t: TOTAL });
      $('win-title').textContent = last ? T.allDone : fill(T.winTitle, { name: toyName(pic) });
      $('win-text').textContent = fill(T.winText, { b, bw: blocksWord(b) });
      drawToy($('win-toy'), pic, 220, 130);
      $('btn-next').querySelector('b').textContent = last ? T.toLevels : T.next;
      $('next-sub').textContent = last ? T.newYear : fill(T.nextSub, { n: levelIndex + 2, name: toyName(PICTURES[levelIndex + 1]) });
      gnomeRow($('win-gnomes'), ['#E8383D', '#3EC1F3', '#F5C04A', '#22A45D', '#FF8A1F'], ['#22A45D', '#C8102E', '#2F6BEB', '#C8102E', '#8B4DF0']);
      confetti();
      els.win.hidden = false;
    }, 450);
  }

  function renderTimer() {
    const s = Math.max(0, Math.ceil(timeLeft));
    if (s === shownSec) return;
    shownSec = s;
    els.timer.querySelector('span').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    els.timer.classList.toggle('low', s <= 10);
  }

  // kind: 'stuck' — ячейкам нечего брать, 'time' — время вышло
  function lose(kind = 'stuck') {
    over = true;
    running = false;
    loseKind = kind;
    Platform.gameplayStop();
    Sound.lose();
    const time = kind === 'time';
    $('lose-title').textContent = time ? T.timeTitle : T.loseTitle;
    $('lose-text').textContent = time ? T.timeText : T.loseText;
    $('revive-label').textContent = time ? fill(T.addTime, { n: TIME_BONUS }) : T.addSlot;
    const box = $('lose-slots');
    box.innerHTML = '';
    box.hidden = time;
    if (!time) slots.filter(Boolean).forEach(bag => { const t = tileEl(bag.color, bag.n - bag.delivered, ''); t.tabIndex = -1; box.appendChild(t); });
    els.lose.hidden = false;
  }

  async function revive() {
    if (!(await Platform.showRewarded())) return;
    if (loseKind === 'time') { timeLeft += TIME_BONUS; timeAdded = true; renderTimer(); }
    else { slots.push(null); extraSlots++; revived = true; }
    els.lose.hidden = true;
    renderUI(); layout();
    over = false; running = true;
    Platform.gameplayStart();
  }

  async function addSlot() {
    if (extraSlots >= MAX_EXTRA || over || !running) return;
    running = false;
    const ok = await Platform.showRewarded();
    running = true;
    if (!ok) return;
    slots.push(null); extraSlots++;
    renderUI(); layout();
  }

  async function addTime() {
    if (over || !running) return;
    running = false;
    const ok = await Platform.showRewarded();
    running = true;
    if (!ok) return;
    timeLeft += TIME_BONUS; timeAdded = true;
    renderTimer();
  }

  // ---------- 0 · загрузка ----------
  // Сцена нарисована под 390×844 и масштабируется целиком; полоса честно ждёт SDK, сохранение и шрифты.
  const LOAD_LIGHTS = ['#FF4D4F', '#FFD23F', '#2BD46F', '#4DB8FF', '#FF7AD9'];
  const WALKER = (box, hat) => '<g class="wad">' +
    `<rect x="9" y="0" width="22" height="18" rx="3" fill="${box}"/><rect x="18" y="0" width="4" height="18" fill="#FFF7E8"/><rect x="9" y="7" width="22" height="4" fill="#FFF7E8"/>` +
    '<ellipse cx="20" cy="55" rx="10" ry="8" fill="#C8102E"/><ellipse cx="15" cy="63" rx="4" ry="1.6" fill="#3A2416"/><ellipse cx="25" cy="63" rx="4" ry="1.6" fill="#3A2416"/>' +
    `<path d="M20 19 L9 38 H31 Z" fill="${hat}"/><rect x="8" y="35.5" width="24" height="4.5" rx="2.2" fill="#FFFFFF"/><circle cx="20" cy="19" r="3.2" fill="#FFFFFF"/>` +
    '<path d="M11 44 Q20 61 29 44 Z" fill="#FFFFFF"/><rect x="12.5" y="39.5" width="15" height="6.5" rx="3" fill="#FFD3A8"/>' +
    '<circle cx="16.3" cy="42" r="1" fill="#2A2D3E"/><circle cx="23.7" cy="42" r="1" fill="#2A2D3E"/><circle cx="20" cy="44.2" r="1.9" fill="#F28B82"/></g>';

  function buildLoader() {
    let stars = '';
    for (let i = 0; i < 22; i++) {
      const r = 1.5 + (i % 3);
      stars += `<i style="left:${(i * 73 + 17) % 380}px;top:${30 + (i * 47) % 220}px;width:${r}px;height:${r}px;` +
        `animation-duration:${(1.6 + (i % 4) * 0.5).toFixed(1)}s;animation-delay:${((i * 0.31) % 2).toFixed(2)}s"></i>`;
    }
    $('ld-stars').innerHTML = stars;
    let bulbs = '';
    for (let b = 0; b < 14; b++) {
      const c = LOAD_LIGHTS[b % 5];
      bulbs += `<i style="background:${c};box-shadow:0 0 12px 3px ${c};animation-delay:${((b * 0.29) % 1.4).toFixed(2)}s"></i>`;
    }
    $('ld-bulbs').innerHTML = bulbs;
    const pts = [[168, 122], [184, 126], [200, 127], [216, 122], [150, 186], [170, 192], [190, 196], [210, 195], [230, 190], [246, 182], [134, 256], [156, 262], [180, 266], [204, 267], [228, 263], [252, 254]];
    $('ld-lights').innerHTML = pts.map(([x, y], j) =>
      `<circle cx="${x}" cy="${y}" r="4" fill="${LOAD_LIGHTS[j % 5]}" style="animation:twinkle 1.3s ease-in-out ${((j * 0.23) % 1.3).toFixed(2)}s infinite"/>`).join('');
    $('ld-walkers').innerHTML = [
      [160, 520, 34, 54, '#FF8A1F', '#22A45D', 0], [170, 540, 30, 48, '#8B4DF0', '#C8102E', 1.4], [150, 530, 32, 51, '#3EC1F3', '#F5C04A', 2.8]
    ].map(([x, y, w, h, box, hat, d]) => `<div style="left:${x}px;top:${y}px;animation-delay:${d}s">` +
      `<svg width="${w}" height="${h}" viewBox="0 0 40 64" style="overflow:visible">${WALKER(box, hat)}</svg></div>`).join('');
    $('ld-runner').innerHTML = '<svg width="22" height="34" viewBox="0 0 40 64">' +
      '<g class="wad"><rect x="9" y="0" width="22" height="18" rx="3" fill="#22A45D"/><rect x="18" y="0" width="4" height="18" fill="#F5C04A"/>' +
      '<ellipse cx="20" cy="55" rx="10" ry="8" fill="#C8102E"/><ellipse cx="15" cy="63" rx="4" ry="1.6" fill="#3A2416"/><ellipse cx="25" cy="63" rx="4" ry="1.6" fill="#3A2416"/>' +
      '<path d="M20 19 L9 38 H31 Z" fill="#C8102E"/><rect x="8" y="35.5" width="24" height="4.5" rx="2.2" fill="#FFFFFF"/><circle cx="20" cy="19" r="3.2" fill="#FFFFFF"/>' +
      '<path d="M11 44 Q20 61 29 44 Z" fill="#FFFFFF"/><rect x="12.5" y="39.5" width="15" height="6.5" rx="3" fill="#FFD3A8"/></g></svg>';
    fitLoader();
    window.addEventListener('resize', fitLoader);
  }

  function fitLoader() {
    const box = $('screen-load'), scene = $('load-scene');
    const s = Math.min(box.clientWidth / 390, box.clientHeight / 844);
    const top = Math.max(0, (box.clientHeight - 844 * s) / 2);
    scene.style.transform = `translate(-50%, ${top}px) scale(${s})`;
  }

  // Полоса идёт к цели target; пока загрузка не закончена, цель не выше 90 %.
  const loader = { pct: 0, target: 0, done: false, raf: 0 };
  function setLoad(p) {
    loader.pct = p;
    const k = Math.min(3, Math.floor(p / 25)), v = Math.round(p);
    $('ld-status').textContent = T.loadSteps[k];
    $('ld-tip').textContent = fill(T.loadTips[k], { n: TOTAL });
    $('ld-pct').textContent = v + '%';
    $('ld-fill').style.width = p + '%';
    $('ld-runner').style.left = `calc(${p}% - 6px)`;
    $('ld-bar').setAttribute('aria-valuenow', v);
  }
  function runLoader(onDone) {
    const t0 = performance.now();
    const step = now => {
      // не быстрее ~1,6 с, чтобы сцена успела показаться
      const cap = loader.done ? 100 : 90;
      const byTime = Math.min(cap, (now - t0) / 16);
      const p = Math.min(cap, Math.max(loader.pct, byTime));
      setLoad(p);
      if (p >= 100) return onDone();
      loader.raf = requestAnimationFrame(step);
    };
    loader.raf = requestAnimationFrame(step);
  }
  function finishLoader() {
    $('ld-progress').hidden = true;
    $('btn-start').hidden = false;
    $('screen-load').removeAttribute('aria-busy');
    $('btn-start').focus({ preventScroll: true });
  }

  // ---------- экраны ----------
  function show(name) {
    els.menu.hidden = name !== 'menu';
    els.map.hidden = name !== 'map';
    els.game.hidden = name !== 'game';
    if (name !== 'game') {
      running = false;
      gnomes = [];
      if (geo) geo.fxCtx.clearRect(0, 0, geo.fw, geo.fh);
      Platform.gameplayStop();
    }
  }

  function openMenu() {
    els.win.hidden = true; els.lose.hidden = true;
    show('menu');
    $('play-sub').textContent = fill(T.levelsCount, { n: TOTAL });
    const colors = ['#FF8A1F', '#22A45D', '#E8383D'];
    $('howto-list').innerHTML = [T.hint0, T.hint1, T.hint2].map((t, i) => `<li><i style="background:${colors[i]}">${i + 1}</i><span>${t}</span></li>`).join('');
    gnomeRow($('menu-gnomes'), ['#22A45D', '#3EC1F3', '#C8102E', '#8B4DF0', '#FF8A1F', '#FF6FB5', '#2F6BEB'],
      ['#C8102E', '#F5C04A', '#22A45D', '#C8102E', '#2F6BEB', '#F5C04A', '#22A45D']);
  }

  function daysToNewYear() {
    const now = new Date();
    const ny = new Date(now.getFullYear() + 1, 0, 1);
    return Math.ceil((ny - now) / 86400000);
  }

  function openMap(scrollToCurrent = true) {
    els.win.hidden = true; els.lose.hidden = true;
    show('map');
    const done = Math.min(save.level, TOTAL);
    const stars = Object.values(save.stars).reduce((a, b) => a + b, 0);
    $('stars-total').textContent = stars;
    $('map-done').textContent = fill(T.done, { n: done, t: TOTAL });
    const d = daysToNewYear();
    $('map-days').textContent = d <= 7 && new Date().getMonth() === 0 ? T.newYear : fill(T.daysLeft, { n: d, w: daysWord(d) });
    $('map-bar').style.width = (done / TOTAL) * 100 + '%';
    const list = els.mapList;
    list.innerHTML = '';
    let currentEl = null;
    CHAPTERS.forEach((ch, ci) => {
      const sec = document.createElement('section');
      const a = ci * 12 + 1, b = ci * 12 + 12;
      const sub = lang === 'ru'
        ? `Уровни ${a}–${b} · ${ch.slots} ${slotsWord(ch.slots)} · ${ch.queues} колонки`
        : fill(T.chSub, { a, b, s: ch.slots, q: ch.queues });
      const flakes = [0, 1, 2, 3].map(k => `<span class="${k <= ci ? '' : 'dim'}">❄</span>`).join('');
      sec.innerHTML = `<div class="chapter-head"><div class="ch-num" style="background:${ch.color}">${ci + 1}</div>` +
        `<div><div class="ch-title">${T.chapter} ${ci + 1} · ${ch.name[lang] || ch.name.ru}</div><div class="ch-sub">${sub}</div></div>` +
        `<div class="flakes" aria-hidden="true">${flakes}</div></div><div class="levels-grid"></div>`;
      const gridEl = sec.querySelector('.levels-grid');
      for (let i = ci * 12; i < ci * 12 + 12 && i < TOTAL; i++) {
        const card = document.createElement('button');
        card.type = 'button';
        const state = i < done ? 'done' : i === done ? 'current' : 'locked';
        card.className = 'lvl ' + state;
        card.setAttribute('aria-label', `${T.level} ${i + 1} · ${toyName(PICTURES[i])}`);
        const cv = document.createElement('canvas');
        if (state === 'current') {
          const inner = document.createElement('div'); inner.className = 'inner'; inner.appendChild(cv); card.appendChild(inner);
          card.insertAdjacentHTML('beforeend', `<span class="num">${i + 1}</span><span class="go">${T.playCard}</span>`);
          currentEl = card;
        } else {
          card.appendChild(cv);
          const st = save.stars[i] || 0;
          card.insertAdjacentHTML('beforeend', `<span class="num">${i + 1}</span>` +
            (state === 'done' ? `<span class="st">${'★'.repeat(st)}<span class="e">${'★'.repeat(3 - st)}</span></span>` : '<span class="lock"></span>'));
        }
        card.addEventListener('click', () => {
          if (state === 'locked') { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); Sound.deny(); return; }
          startLevel(i);
        });
        gridEl.appendChild(card);
        requestAnimationFrame(() => drawToy(cv, PICTURES[i], 84, 62));
      }
      list.appendChild(sec);
    });
    // прокручиваем к началу главы с текущим уровнем, чтобы её заголовок был виден
    if (scrollToCurrent && currentEl) {
      const sec = currentEl.closest('section');
      requestAnimationFrame(() => { list.scrollTop = sec.offsetTop - list.offsetTop - 12; });
    } else list.scrollTop = 0;
  }

  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => { if (T[el.dataset.i18n]) el.textContent = T[el.dataset.i18n]; });
    document.title = T.title;
    document.documentElement.lang = lang;
  }

  async function main() {
    buildLoader();
    setLoad(0);
    runLoader(finishLoader);
    await Platform.init();
    lang = STR[Platform.lang] ? Platform.lang : 'en';
    T = STR[lang];
    applyI18n();
    $('ld-version').textContent = fill(T.version, { n: TOTAL });
    els.sack.innerHTML = SACK_SVG;
    $('sad-gnome').innerHTML = SAD_GNOME;
    buildGarland();
    const saved = await Platform.load();
    if (saved && typeof saved.level === 'number') save = { level: saved.level, stars: saved.stars || {} };
    try { await document.fonts.ready; } catch (e) {}

    Platform.onPause = () => { Sound.paused = true; Music.stop(); };
    Platform.onResume = () => { Sound.paused = false; Music.start(); };
    document.addEventListener('visibilitychange', () => (document.hidden ? Platform.onPause() : Platform.onResume()));

    $('btn-start').addEventListener('click', () => {
      $('screen-load').hidden = true;
      window.removeEventListener('resize', fitLoader);
      openMenu();
    });
    $('btn-play').addEventListener('click', () => openMap());
    $('btn-map-back').addEventListener('click', openMenu);
    $('btn-map').addEventListener('click', () => openMap());
    $('btn-restart').addEventListener('click', () => startLevel(levelIndex));
    els.addSlot.addEventListener('click', addSlot);
    els.addTime.addEventListener('click', addTime);
    $('btn-next').addEventListener('click', async () => {
      const done = levelIndex;
      els.win.hidden = true;
      if (done >= TOTAL - 1) return openMap();
      if (done >= 4) await Platform.showInterstitial();
      startLevel(done + 1);
    });
    $('btn-replay').addEventListener('click', () => startLevel(levelIndex));
    $('btn-revive').addEventListener('click', revive);
    $('btn-lose-map').addEventListener('click', () => openMap());
    $('btn-lose-restart').addEventListener('click', () => startLevel(levelIndex));
    els.sound.addEventListener('click', () => {
      Sound.on = Music.on = !Sound.on;
      els.sound.classList.toggle('off', !Sound.on);
      if (Music.on) Music.start(); else Music.stop();
    });
    // музыка стартует после первого нажатия: браузеры не дают играть звук без действия игрока
    document.addEventListener('pointerdown', () => Music.start(), { once: true });
    window.addEventListener('resize', () => { if (grid && !els.game.hidden) { renderUI(); layout(); } });
    document.addEventListener('contextmenu', e => e.preventDefault());

    // для автотестов: index.html#debug
    if (location.hash === '#debug') window.__gifts = { state: () => ({ queues, slots, grid, gnomes: gnomes.length, over, timeLeft }), Engine, start: startLevel, lose, timeLimit };

    loader.done = true;
    requestAnimationFrame(frame);
    Platform.ready();
  }

  main();
})();

</script>

</body></html>
