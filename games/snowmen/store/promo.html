<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Снеговички — промо</title>
<style>
  /* Макеты иконки и обложки для карточки игры. Открывать как promo.html#icon или #cover. */
  :root { --snow: #eef3f9; --ink: #22324a; --berry: #d93a52; --pine: #2e7a58;
    --r0: #ffd9d9; --r1: #ffe6b8; --r2: #fff3a8; --r3: #d3f2c6; --r4: #c8e9f6; --r5: #dcd5ff; }
  html, body { margin: 0; }
  body { font-family: "Trebuchet MS", system-ui, sans-serif; color: var(--ink); }
  .frame { position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 20% 10%, #fff 0 3px, transparent 4px) 0 0 / 52px 52px,
      radial-gradient(circle at 70% 60%, #fff 0 2px, transparent 3px) 0 0 / 38px 38px,
      linear-gradient(180deg, #d6e3f2, var(--snow)); }
  .grid { display: grid; border: 6px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 0 16px 40px #22324a33; }
  .grid div { display: flex; align-items: center; justify-content: center; }
  .grid svg { width: 84%; height: 84%; }
  .x::before { content: "✕"; color: #22324a66; font-size: 60%; }
  #icon { width: 512px; height: 512px; display: flex; align-items: center; justify-content: center; }
  #icon .grid { grid-template-columns: repeat(3, 130px); grid-auto-rows: 130px; font-size: 80px; }
  #cover { width: 800px; height: 470px; display: flex; align-items: center; gap: 36px; padding: 0 44px; box-sizing: border-box; }
  #cover .grid { grid-template-columns: repeat(5, 70px); grid-auto-rows: 70px; font-size: 44px; flex: none; }
  #cover h1 { margin: 0; font-size: 52px; line-height: 1; }
  #cover h1::after { content: ""; display: block; width: 90px; height: 7px; margin-top: 14px; border-radius: 4px; background: var(--berry); }
  #cover p { margin: 18px 0 0; font-size: 24px; color: #4a5d78; max-width: 14em; }
  .big svg { width: 150px; height: 150px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="icon" class="frame" hidden><div class="grid" id="icon-grid"></div></div>
<div id="cover" class="frame" hidden>
  <div class="grid" id="cover-grid"></div>
  <div><h1>Снеговички</h1><p>Расставь снеговиков по дворикам. Логика, а не удача!</p></div>
</div>
<script>
  const S = '<svg viewBox="0 0 40 40"><circle cx="20" cy="28" r="9" fill="#fff" stroke="#22324a" stroke-width="1.6"/><circle cx="20" cy="15.5" r="6.5" fill="#fff" stroke="#22324a" stroke-width="1.6"/><rect x="13.5" y="7" width="13" height="2.6" rx="1.2" fill="#d93a52"/><rect x="15.5" y="2" width="9" height="6" rx="1.5" fill="#d93a52"/><circle cx="17.8" cy="14.5" r="1" fill="#22324a"/><circle cx="22.2" cy="14.5" r="1" fill="#22324a"/><path d="M20 16.3 l5.5 1.3 -5.5 1.1z" fill="#ff8a1c"/><path d="M13.6 21.8 q6.4 3 12.8 0" stroke="#2e7a58" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="20" cy="26.5" r="1.1" fill="#22324a"/><circle cx="20" cy="30.5" r="1.1" fill="#22324a"/></svg>';
  // Поле: цвета двориков, s — снеговик, x — крестик
  function fill(el, regions, items) {
    regions.forEach((row, r) => [...row].forEach((g, c) => {
      const d = document.createElement('div');
      d.style.background = `var(--r${g})`;
      const t = items[r][c];
      if (t === 's') d.innerHTML = S; else if (t === 'x') d.className = 'x';
      const up = r > 0 && regions[r - 1][c] !== g, left = c > 0 && row[c - 1] !== g;
      d.style.borderTop = r > 0 ? (up ? '4px solid #22324a' : '1px solid #22324a22') : 'none';
      d.style.borderLeft = c > 0 ? (left ? '4px solid #22324a' : '1px solid #22324a22') : 'none';
      el.appendChild(d);
    }));
  }
  fill(document.getElementById('icon-grid'), ['001', '021', '221'], ['.x.', 'x.x', 's.x']);
  fill(document.getElementById('cover-grid'),
    ['00111', '00114', '22314', '23334', '22344'],
    ['.s.x.', 'x..s.', 's.x..', '..s.x', 'x...s'].map(r => [...r]));
  document.getElementById((location.hash || '#cover').slice(1)).hidden = false;
</script>
</body>
</html>
