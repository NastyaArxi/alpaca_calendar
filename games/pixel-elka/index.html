<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Пиксельная Ёлка</title>
  <link rel="stylesheet" href="style.css">
  <script src="/sdk.js"></script>
</head>
<body>
  <div id="app">
    <section id="screen-menu" class="screen">
      <canvas id="menu-art" width="160" height="160"></canvas>
      <h1 data-i18n="title">Пиксельная Ёлка</h1>
      <p class="subtitle" data-i18n="subtitle">Собирай цвета — рисуй Новый год</p>
      <button id="btn-play" class="btn primary" data-i18n="play">Играть</button>
      <button id="btn-gallery" class="btn" data-i18n="gallery">Открытки</button>
    </section>

    <section id="screen-game" class="screen" hidden>
      <header class="topbar">
        <button id="btn-home" class="icon-btn" aria-label="menu">⌂</button>
        <div id="level-label"></div>
        <button id="btn-sound" class="icon-btn" aria-label="sound">♪</button>
      </header>
      <div id="board-wrap"><canvas id="board"></canvas></div>
      <div id="hint" hidden></div>
      <div id="bar"></div>
      <div class="tools">
        <button id="btn-undo" class="btn small"><span data-i18n="undo">Отменить</span> <i class="ad">▶</i></button>
        <button id="btn-slot" class="btn small"><span data-i18n="slot">+1 полка</span> <i class="ad">▶</i></button>
      </div>
      <div id="columns"></div>
    </section>

    <section id="screen-gallery" class="screen" hidden>
      <header class="topbar">
        <button id="btn-gallery-back" class="icon-btn" aria-label="back">←</button>
        <div data-i18n="gallery">Открытки</div>
        <span class="icon-btn"></span>
      </header>
      <div id="gallery-grid"></div>
    </section>

    <div id="modal" class="modal" hidden>
      <div class="modal-card">
        <h2 id="modal-title"></h2>
        <canvas id="modal-art" width="192" height="192"></canvas>
        <p id="modal-text"></p>
        <div id="modal-buttons"></div>
      </div>
    </div>

    <div id="fly-layer"></div>
  </div>

  <script src="pictures.js"></script>
  <script src="levelgen.js"></script>
  <script src="platform.js"></script>
  <script src="game.js"></script>
</body>
</html>
