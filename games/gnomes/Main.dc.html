<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var lc = ['#FF4D4F', '#FFD23F', '#2BD46F', '#4DB8FF', '#FF7AD9'];
    var bulbs = [];
    for (var b = 0; b < 14; b++) bulbs.push({ c: lc[b % 5], d: ((b * 0.29) % 1.4).toFixed(2) });
    var stars = [];
    for (var i = 0; i < 18; i++) stars.push({ x: (i * 73 + 17) % 380, y: 92 + (i * 47) % 150, r: 1.5 + (i % 3), dur: (1.6 + (i % 4) * 0.5).toFixed(1), d: ((i * 0.31) % 2).toFixed(2) });

    // Toy car of level 1, one letter per block: R body, D dark body, W window, Y headlight, O tail light, K wheel
    var shape = [
      '...RRRR...',
      '..RWWRWR..',
      'ORRRRRRRRY',
      'DDDDDDDDDD',
      '.KK....KK.'
    ];
    var col = { R: '#E5293F', D: '#B80D25', W: '#9FE0FF', Y: '#FFD23F', O: '#FF8A1F', K: '#2A2D3E' };
    var size = 18, x0 = 195 - (10 * size) / 2, y0 = 212 - 5 * size;
    var blocks = [];
    shape.forEach(function (row, r) {
      row.split('').forEach(function (ch, c) {
        if (ch === '.') return;
        var x = x0 + c * size, y = y0 + r * size;
        blocks.push({ x: x, y: y, c: col[ch], hx: x + 3, hy: y + 3 });
      });
    });

    var sparks = [[112, 96], [282, 84], [96, 176], [292, 168], [150, 62], [244, 54]].map(function (p, j) {
      return { x: p[0], y: p[1], dur: (1.8 + (j % 3) * 0.4).toFixed(1), d: (j * 0.37).toFixed(2) };
    });

    var done = 0, total = 48;
    return {
      bulbs: bulbs, stars: stars, blocks: blocks, sparks: sparks,
      level: done + 1, toy: 'Машинка', toyLower: 'машинка',
      done: done, total: total, donePct: Math.round((done / total) * 100),
      starsGot: 0, starsMax: total * 3
    };
  }
}
</script>
