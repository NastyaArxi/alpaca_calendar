<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Гномы Деда Мороза</title>
  <link rel="stylesheet" href="style.css">
  <script src="/sdk.js"></script>
</head>
<body>
  <div id="app">
    <section id="screen-menu" class="screen">
      <canvas id="menu-art"></canvas>
      <h1 data-i18n="title">Гномы Деда Мороза</h1>
      <p class="subtitle" data-i18n="subtitle">Помоги гномам собрать подарки по цветам</p>
      <button id="btn-play" class="btn primary" data-i18n="play">Играть</button>
    </section>

    <section id="screen-game" class="screen" hidden>
      <header class="topbar">
        <button id="btn-home" class="icon-btn" aria-label="menu">⌂</button>
        <div id="level-label"></div>
        <button id="btn-sound" class="icon-btn" aria-label="sound">♪</button>
      </header>
      <div id="stage"><canvas id="board"></canvas></div>
      <div id="hint" hidden></div>
      <div class="row-label"><span data-i18n="slots">Ждут на скамейке</span> <span id="track-info"></span></div>
      <div id="slots"></div>
      <div id="queues"></div>
      <div class="tools">
        <button id="btn-slot" class="btn small"><span data-i18n="addSlot">+1 место</span> <i class="ad">▶</i></button>
        <button id="btn-restart" class="btn small" data-i18n="restart">Заново</button>
      </div>
    </section>

    <div id="modal" class="modal" hidden>
      <div class="modal-card">
        <h2 id="modal-title"></h2>
        <canvas id="modal-art"></canvas>
        <p id="modal-text"></p>
        <div id="modal-buttons"></div>
      </div>
    </div>
  </div>

  <script src="pictures.js"></script>
  <script src="engine.js"></script>
  <script src="platform.js"></script>
  <script src="game.js"></script>
</body>
</html>
