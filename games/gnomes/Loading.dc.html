body{margin:0}
a{color:#F5C04A}a:hover{color:#FFE08A}
.snowA,.snowB{position:absolute;left:0;right:0;top:-400px;bottom:0;pointer-events:none}
.snowA{background-image:radial-gradient(circle at 20px 30px,rgba(255,255,255,.95) 1.8px,transparent 2.6px),radial-gradient(circle at 90px 80px,rgba(255,255,255,.7) 1.4px,transparent 2.2px),radial-gradient(circle at 60px 115px,rgba(255,255,255,.55) 1.1px,transparent 1.9px);background-size:130px 130px;animation:snowA 14s linear infinite}
.snowB{background-image:radial-gradient(circle at 40px 50px,rgba(255,255,255,.9) 2.8px,transparent 3.6px),radial-gradient(circle at 150px 140px,rgba(255,255,255,.6) 2.2px,transparent 3px);background-size:195px 195px;animation:snowB 9s linear infinite;opacity:.8}
@keyframes snowA{from{background-position:0 0}to{background-position:26px 390px}}
@keyframes snowB{from{background-position:0 0}to{background-position:-39px 390px}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes aurora{0%,100%{transform:translateX(-30px) skewX(-8deg);opacity:.55}50%{transform:translateX(30px) skewX(8deg);opacity:.9}}
@keyframes starGlow{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px #FFD23F)}50%{transform:scale(1.12);filter:drop-shadow(0 0 16px #FFE08A)}}
@keyframes titleIn{0%{transform:translateY(-24px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes waddle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes wave{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-30deg)}}
@keyframes walkIn{0%{transform:translateX(150px);opacity:0}10%{opacity:1}80%{transform:translateX(0);opacity:1}100%{transform:translateX(-10px);opacity:0}}
@keyframes gulp{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95)}}
@keyframes shine{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #7A0819,0 0 0 0 rgba(245,192,74,.7)}50%{box-shadow:0 6px 0 #7A0819,0 0 0 10px rgba(245,192,74,0)}}
@keyframes candy{from{background-position:0 0}to{background-position:28px 0}}
.wad{transform-box:fill-box;transform-origin:50% 100%;animation:waddle .34s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () {
      var p = (self.state && self.state.p) || 0;
      if (p >= 100) { clearInterval(self.timer); return; }
      self.setState({ p: Math.min(100, p + 1) });
    }, 45);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var p = (this.state && this.state.p) || 0;
    var statuses = ['Гномы просыпаются…', 'Упаковываем подарки…', 'Наряжаем ёлку…', 'Завязываем мешок…'];
    var tips = ['Совет: гномы берут только блоки с краю — разбирай игрушку снаружи внутрь.', 'Совет: не занимай все ячейки одним цветом — оставь место для манёвра.', 'Совет: нет ходов? Возьми «+1 ячейку» и продолжай.', 'Всего 48 игрушек — от машинки до мешка Деда Мороза!'];
    var k = Math.min(3, Math.floor(p / 25));
    var lc = ['#FF4D4F', '#FFD23F', '#2BD46F', '#4DB8FF', '#FF7AD9'];
    var bulbs = [];
    for (var b = 0; b < 14; b++) bulbs.push({ c: lc[b % 5], d: ((b * 0.29) % 1.4).toFixed(2) });
    var stars = [];
    for (var i = 0; i < 22; i++) stars.push({ x: (i * 73 + 17) % 380, y: 30 + (i * 47) % 220, r: 1.5 + (i % 3), dur: (1.6 + (i % 4) * 0.5).toFixed(1), d: ((i * 0.31) % 2).toFixed(2) });
    var lightPts = [[168, 122], [184, 126], [200, 127], [216, 122], [150, 186], [170, 192], [190, 196], [210, 195], [230, 190], [246, 182], [134, 256], [156, 262], [180, 266], [204, 267], [228, 263], [252, 254]];
    var lights = lightPts.map(function (pt, j) { return { x: pt[0], y: pt[1], r: 4, c: lc[j % 5], d: ((j * 0.23) % 1.3).toFixed(2) }; });
    var walkers = [
      { x: 160, y: 520, s: 34, h: 54, box: '#FF8A1F', hat: '#22A45D', dur: 4.2, d: 0 },
      { x: 170, y: 540, s: 30, h: 48, box: '#8B4DF0', hat: '#C8102E', dur: 4.2, d: 1.4 },
      { x: 150, y: 530, s: 32, h: 51, box: '#3EC1F3', hat: '#F5C04A', dur: 4.2, d: 2.8 }
    ];
    return { pct: p, loading: p < 100, ready: p >= 100, status: statuses[k], tip: tips[k], bulbs: bulbs, stars: stars, lights: lights, walkers: walkers };
  }
}
</script>
